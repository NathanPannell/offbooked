name: Deploy backend

# Production only: deploys main to Railway. Merges into staging never deploy (staging has no
# environment yet), and a manual run from any other branch is refused by the job's `if`.
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - railway.json
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      # Pinned to the version the last production deploys used; bump it deliberately.
      - run: npm install -g @railway/cli@5.70.0
      - name: Set revision
        run: >
          railway variable set "APP_REVISION=${GITHUB_SHA}" --skip-deploys
          --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_ID"
      - name: Deploy
        run: >
          railway up --ci
          --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_ID"
      - name: Verify deployed revision
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS "$API_URL/health" || true)
            echo "$body"
            if echo "$body" | grep -q "\"revision\":\"${GITHUB_SHA}\""; then exit 0; fi
            sleep 10
          done
          echo "Deployed /health never reported ${GITHUB_SHA}" >&2
          exit 1
